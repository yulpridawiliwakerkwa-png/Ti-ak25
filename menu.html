<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu — TI AK25</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url('foto/WhatsApp\ Image\ 2026-09-09\ at\ 12.33.52.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 700px; margin: 0 auto; text-align: center; }
        h1 { font-size: 2.8em; color: #facc15; margin-bottom: 50px; text-shadow: 2px 4px 8px rgba(0,0,0,0.5); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .kartu {
            background: rgba(255,255,255,0.1);
            padding: 30px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .kartu:hover {
            background: rgba(255,255,255,0.2);
            border-color: #facc15;
            transform: translateY(-5px);
        }
        .emoji { font-size: 3em; margin-bottom: 10px; }
        h3 { font-size: 1.4em; color: #facc15; margin-bottom: 5px; }
        .kembali {
            display: inline-block;
            margin-top: 50px;
            color: #facc15;
            text-decoration: none;
            font-size: 1.1em;
        }
        .kembali:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 MENU UTAMA</h1>

        <div class="grid">
            <a href="profil.html" class="kartu">
                <div class="emoji">📋</div>
                <h3>Profil </h3>
                <p>asal mula, persaudaraan, dan harapan satu angkatan</p>
            </a>

            <a href="anggota.html" class="kartu">
                <div class="emoji">👥</div>
                <h3>Anggota</h3>
                <p>Saudara seperjuang</p>
            </a>

            <a href="jadwal.html" class="kartu">
                <div class="emoji">📅</div>
                <h3>Jadwal</h3>
                <p>waktu yang lalui bersama</p>
            </a>

            <a href="galeri.html" class="kartu">
                <div class="emoji">📸</div>
                <h3>Galeri</h3>
                <p>Kenangan bersama</p>
            </a>
        </div>

        <a href="index.html" class="kembali">← Kembali ke Beranda</a>
    </div>
</body>
</html>
